spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/contract_analyzer_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] %logger{36} - %msg%n"

file:
  upload-dir: uploads/

huggingface:
  api:
    url: ${HUGGINGFACE_API_URL:https://router.huggingface.co/hf-inference/models/facebook/bart-large-cnn}
    token: ${HUGGINGFACE_API_TOKEN:}
    connect-timeout-ms: ${HUGGINGFACE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${HUGGINGFACE_READ_TIMEOUT_MS:30000}
    max-attempts: ${HUGGINGFACE_MAX_ATTEMPTS:3}
    retry-backoff-ms: ${HUGGINGFACE_RETRY_BACKOFF_MS:750}
