spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] %logger{36} - %msg%n"

file:
  upload-dir: ${FILE_UPLOAD_DIR}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret-key: ${JWT_SECRET_KEY}
  openapi:
    server-url: ${OPENAPI_SERVER_URL}
    server-description: ${OPENAPI_SERVER_DESCRIPTION}

huggingface:
  api:
    url: ${HUGGINGFACE_API_URL}
    token: ${HUGGINGFACE_API_TOKEN}
    connect-timeout-ms: ${HUGGINGFACE_CONNECT_TIMEOUT_MS}
    read-timeout-ms: ${HUGGINGFACE_READ_TIMEOUT_MS}
    max-attempts: ${HUGGINGFACE_MAX_ATTEMPTS}
    retry-backoff-ms: ${HUGGINGFACE_RETRY_BACKOFF_MS}
